<!DOCTYPE html>
<html lang="en">
<head>

<title>NAYAK Agro Ledger</title>
<style>
:root{--g:#14532d;--g2:#166534;--gl:#dcfce7;--y:#f59e0b;--r:#dc2626;--b:#2563eb;--bg:#f4f6f3;--tx:#1f2937;--mu:#6b7280;--bd:#e5e7eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
header .logo{width:36px;height:36px;border-radius:9px;background:#fff;color:var(--g);font-weight:900;display:grid;place-items:center;font-size:18px}
header h1{font-size:17px;margin:0;letter-spacing:.6px}header small{opacity:.8;font-size:11px;display:block;letter-spacing:0}
header .net{margin-left:auto;font-size:11px;background:#ffffff22;padding:4px 8px;border-radius:20px}
main{padding:12px 12px 96px;max-width:760px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:8px 0 6px;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:20px}nav button.on{color:var(--g);font-weight:700}
.card{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{border-radius:12px;padding:10px;background:#fff;box-shadow:0 1px 3px #0001}
.stat b{display:block;font-size:18px;margin-top:2px}.stat span{font-size:12px;color:var(--mu)}
.inc{color:#15803d}.exp{color:var(--r)}.pen{color:#b45309}.blu{color:var(--b)}
.item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--bd);cursor:pointer}.item:last-child{border:0}
.item .av{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none;background:var(--gl)}
.item .mid{flex:1;min-width:0}.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item .s{font-size:12px;color:var(--mu)}
.item .amt{text-align:right;font-weight:700;white-space:nowrap}.item .amt small{display:block;font-weight:500;font-size:11px}
.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:600;font-size:14px;background:var(--g);color:#fff;cursor:pointer}
.btn.o{background:#fff;color:var(--g);border:1px solid var(--g)}.btn.r{background:var(--r)}.btn.y{background:var(--y);color:#111}.btn.b{background:var(--b)}.btn.s{padding:7px 10px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns .btn{flex:1}
.fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--y);color:#111;font-size:32px;border:0;box-shadow:0 4px 12px #0003;z-index:6}
h2{font-size:15px;margin:16px 2px 8px;color:var(--g)}
select,input,textarea{font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;width:100%;background:#fff;color:var(--tx)}
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}.filters select,.filters input{width:auto;min-width:120px;padding:8px;flex:1}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:8px}label input,label select,label textarea{margin-top:3px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.sheet-bg{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom))}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}.sheet .hd h3{margin:0;font-size:17px}
.x{border:0;background:#eee;border-radius:50%;width:34px;height:34px;font-size:16px;flex:none}
.seg{display:flex;background:#f1f5f9;border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:8px 2px;border-radius:8px;font-size:12px;font-weight:600;color:var(--mu)}
.seg button.on{background:#fff;color:var(--g);box-shadow:0 1px 3px #0002}
.tag{font-size:11px;padding:2px 7px;border-radius:20px;background:var(--gl);color:var(--g);font-weight:600;white-space:nowrap}
.tag.r{background:#fee2e2;color:var(--r)}.tag.y{background:#fef3c7;color:#92400e}.tag.b{background:#dbeafe;color:#1e40af}
.empty{text-align:center;color:var(--mu);padding:22px 8px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 4px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}.n{text-align:right!important;white-space:nowrap}
#login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#14532d,#166534 55%,#f59e0b);padding:20px}
#login .box{background:#fff;border-radius:18px;padding:24px;width:100%;max-width:360px;box-shadow:0 10px 30px #0004}
#login .brand{text-align:center;margin-bottom:16px}#login .brand .logo{width:64px;height:64px;border-radius:16px;background:var(--g);color:#fff;font-size:34px;font-weight:900;display:grid;place-items:center;margin:0 auto 8px}
#login h1{margin:0;color:var(--g);letter-spacing:2px}#login p{margin:4px 0 0;color:var(--mu);font-size:13px}
.err{color:var(--r);font-size:13px;min-height:18px;margin:4px 0}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;z-index:50;max-width:90%;text-align:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border-radius:14px;padding:18px 10px;text-align:center;border:0;font-size:14px;font-weight:600;box-shadow:0 1px 3px #0001;color:var(--tx)}.tile .i{font-size:30px;display:block;margin-bottom:6px}
.big{font-size:24px;font-weight:800}
.back{border:0;background:none;color:var(--g);font-weight:700;font-size:14px;padding:4px 0 8px}
.hidden{display:none!important}
.printhead{display:none}
@media print{header,nav,.fab,.noprint{display:none!important}main{padding:0}.printhead{display:block}.card{box-shadow:none;border:1px solid #ddd}}
</style>
</head>
<body>

<div id="login" class="hidden">
  <form class="box" id="loginForm">
    <div class="brand"><div class="logo">N</div><h1>NAYAK</h1><p>Agro Ledger · Harvester &amp; Tractor Accounts</p></div>
    <label>Username<input name="u" autocomplete="username" required autocapitalize="none"></label>

    <button class="btn" style="width:100%">Login</button>
    <p id="loginHint" style="text-align:center;font-size:12px;color:var(--mu);margin-top:12px"></p>

</div>

<div id="app" class="hidden">
  <header>
    <div class="logo">N</div>
    <div><h1>NAYAK Agro</h1><small>Harvester · Tractor · Lease · Loans</small></div>
    <span class="net" id="net">●</span>
  </header>
  <main id="view"></main>
  <button class="fab" id="fab" onclick="A.fab()">+</button>

    <button data-t="home" onclick="A.go('home')"><span class="i">🏠</span>Home</button>

    <button data-t="parties" onclick="A.go('parties')"><span class="i">👥</span>Parties</button>
    <button data-t="leases" onclick="A.go('leases')"><span class="i">📄</span>Lease</button>
    <button data-t="more" onclick="A.go('more')"><span class="i">☰</span>More</button>
  </nav>
</div>

<script type="module">
/* =========================================================
   1) FIREBASE CONFIG — paste from Firebase Console
      (Project settings → Your apps → Web app → Config)
      Leave apiKey empty to run in LOCAL DEMO mode (data on this phone only).
   ========================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBuZ6I5H3V51pJ-udWj0fC3AMKPQX-EEz0",
  authDomain: "nayak-agro.firebaseapp.com",
  projectId: "nayak-agro",
  storageBucket: "nayak-agro.firebasestorage.app",
  messagingSenderId: "807261361632",
  appId: "1:807261361632:web:8abb08e4c4fb26b9610785",
  measurementId: "G-2BSZRZZWNN"
};
const LOGIN_DOMAIN = "nayakagro.app";   // username "nayak" → nayak@nayakagro.app
const BIZ = "nayak";                    // Firestore path: biz/nayak/<collection>
const CLOUD = !!FIREBASE_CONFIG.apiKey;
const SDK = "https://www.gstatic.com/firebasejs/10.12.2/";

/* ---------- constants ---------- */
const COLS = ['machines','parties','txns','loans','loanPays','leases','bookings'];
const MAIN_TYPES = ['income','expense','receipt','payment'];
const HOLD = ['advance','refund','adjust','forfeit'];   // advance (booking) / security deposit (lease) movements
const TYPE_LBL = {income:'Income',expense:'Expense',receipt:'Received',payment:'Paid Out',advance:'Advance Received',refund:'Advance Refunded',adjust:'Advance Adjusted',forfeit:'Advance Kept'};
const ICON = {income:'🌾',expense:'⛽',receipt:'💰',payment:'💸',advance:'📥',refund:'↩️',adjust:'🔁',forfeit:'📌'};
const TBG = {income:'#dcfce7',expense:'#fee2e2',receipt:'#dbeafe',payment:'#fef3c7',advance:'#e0e7ff',refund:'#fce7f3',adjust:'#f1f5f9',forfeit:'#dcfce7'};
const holdLbl = t => t.leaseId ? TYPE_LBL[t.type].replace('Advance','Deposit') : TYPE_LBL[t.type];
const BOOK_UNITS = ['Hour','Minute','Acre','Day','Trip','Season'];
const CATS = {
  income:['Harvesting Work','Tractor Work (Ploughing/Cultivation)','Tractor Trolley / Transport','Lease Rent','Other Income'],
  expense:['Diesel','Repair & Maintenance','Spare Parts','Driver / Operator Salary','Helper Wages','Insurance','Tax / Permit / RTO','Transport / Shifting','Food & Misc','Other Expense']
};
const MACHINE_TYPES = ['Harvester','Tractor','Trolley','Rotavator','Cultivator','Other'];
const PARTY_KINDS = ['Client / Farmer','Lessee (Lease)','Supplier / Shop','Driver / Staff','Lender','Other'];
const LOAN_KINDS = ['Bank Loan','Hand Loan (Family/Friend)','Machine Finance','Other'];
const LEASE_BASIS = ['Per Hour','Per Minute','Per Acre','Per Day','Per Month','Per Season','Lump Sum'];
const TIME_BASIS = ['Per Hour','Per Minute'];
const MODES = ['Cash','UPI','Bank','Cheque'];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g,'')); return isFinite(n) ? n : 0; };
const inr = n => (n < 0 ? '−' : '') + '₹' + Math.round(Math.abs(+n || 0)).toLocaleString('en-IN');
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const fd = d => d ? d.split('-').reverse().join('-') : '';
const curMonth = () => today().slice(0,7);
const opts = (arr, sel) => arr.map(x => `<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('');
const sum = (arr, f) => arr.reduce((s,x) => s + f(x), 0);
const byDateDesc = (a,b) => (b.date||'').localeCompare(a.date||'') || (b.createdAt||0) - (a.createdAt||0);
const byDateAsc = (a,b) => (a.date||'').localeCompare(b.date||'') || (a.createdAt||0) - (b.createdAt||0);
function toast(m, ms=2200){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }
function download(name, text, type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }

/* ---------- data layer (Firestore or local) ---------- */
let DB = Object.fromEntries(COLS.map(c => [c, []]));
let auth, db, F = {}, AU = {}, unsubs = [];
if (CLOUD) {
  const [ap, au, fs] = await Promise.all([import(SDK+'firebase-app.js'), import(SDK+'firebase-auth.js'), import(SDK+'firebase-firestore.js')]);
  const app = ap.initializeApp(FIREBASE_CONFIG);
  auth = au.getAuth(app); AU = au; F = fs;
  await au.setPersistence(auth, au.browserLocalPersistence).catch(() => {}); // stay logged in until logout / force logout
  try { db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
  catch (e) { db = fs.getFirestore(app); }
}
const LKEY = 'nayak_agro_db', LOGIN_AT = 'nayak_force_ver';
const syncErr = e => toast('Sync error: ' + e.message, 4000);
const store = {
  newId(){ return CLOUD ? F.doc(F.collection(db,'biz',BIZ,'txns')).id : Date.now().toString(36) + Math.random().toString(36).slice(2,8); },
  set(c, id, obj){
    obj = {...obj}; delete obj.id; obj.updatedAt = Date.now();
    if (CLOUD) F.setDoc(F.doc(db,'biz',BIZ,c,id), obj, {merge:true}).catch(syncErr); // no await → works offline
    else { const i = DB[c].findIndex(x => x.id === id); const rec = {...(i>=0?DB[c][i]:{}), ...obj, id}; if (i>=0) DB[c][i] = rec; else DB[c].push(rec); saveLocal(); schedule(); }
    return id;
  },
  add(c, obj){ return this.set(c, this.newId(), {...obj, createdAt: Date.now()}); },
  del(c, id){
    if (CLOUD) F.deleteDoc(F.doc(db,'biz',BIZ,c,id)).catch(syncErr);
    else { DB[c] = DB[c].filter(x => x.id !== id); saveLocal(); schedule(); }
  },
  start(){
    this.stop();
    if (CLOUD) {
      unsubs = COLS.map(c => F.onSnapshot(F.collection(db,'biz',BIZ,c), s => { DB[c] = s.docs.map(d => ({id:d.id, ...d.data()})); schedule(); }, syncErr));
      // Force logout: if admin pressed "Force logout all devices" after this device logged in → sign out
      unsubs.push(F.onSnapshot(F.doc(db,'biz',BIZ,'config','app'), s => {
        if (s.metadata.fromCache) return;                      // only trust server value
        const v = (s.exists() && s.data().forceVer) || 0, mine = localStorage.getItem(LOGIN_AT);
        if (mine === null) localStorage.setItem(LOGIN_AT, v);    // fresh login → remember current version
        else if (v > num(mine)) { localStorage.removeItem(LOGIN_AT); AU.signOut(auth); toast('Logged out by admin', 4000); }
      }, () => {}));
    }
    else { try { const d = JSON.parse(localStorage.getItem(LKEY) || '{}'); COLS.forEach(c => DB[c] = d[c] || []); } catch(e){} schedule(); }
  },
  stop(){ unsubs.forEach(u => u()); unsubs = []; }
};
function saveLocal(){ localStorage.setItem(LKEY, JSON.stringify(DB)); }

/* ---------- lookups & calculations ---------- */
const mName = id => (DB.machines.find(m => m.id === id) || {}).name || '';
const pName = id => (DB.parties.find(p => p.id === id) || {}).name || '';
const party = id => DB.parties.find(p => p.id === id);

function range(p){
  if (p === 'all') return ['0000-00-00','9999-99-99'];
  if (p.startsWith('fy')) { const y = +p.slice(2); return [`${y}-04-01`, `${y+1}-03-31`]; }
  return [p+'-01', p+'-31'];
}
const inRange = (d, p) => { const [a,b] = range(p); return (d||'') >= a && (d||'') <= b; };
function periodOpts(){
  const d = new Date(), fy = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1;
  const o = [['all','All Time'], ['fy'+fy, `FY ${fy}-${String(fy+1).slice(2)}`], ['fy'+(fy-1), `FY ${fy-1}-${String(fy).slice(2)}`]];
  for (let i = 0; i < 24; i++) { const m = new Date(d.getFullYear(), d.getMonth()-i, 1); o.push([`${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,'0')}`, m.toLocaleString('en-IN',{month:'short',year:'numeric'})]); }
  return o;
}
const periodLabel = p => (periodOpts().find(x => x[0] === p) || [p,p])[1];

/* Party balance: + means party owes us (receivable), − means we owe party (payable) */
function txPartyEffect(t){
  const a = num(t.amount), p = num(t.paid);
  return t.type==='income' ? a-p : t.type==='expense' ? -(a-p) : t.type==='receipt' ? -a : t.type==='payment' ? a : t.type==='adjust' ? -a : 0;
}
/* Money held (booking advance / lease deposit): advance − refund − adjusted − kept */
const holdVal = t => t.type === 'advance' ? num(t.amount) : -num(t.amount);
const heldOf = (key, id) => sum(DB.txns.filter(t => t[key] === id && HOLD.includes(t.type)), holdVal);
function heldTotals(){ let adv = 0, dep = 0; DB.txns.forEach(t => { if (!HOLD.includes(t.type)) return; if (t.leaseId) dep += holdVal(t); else adv += holdVal(t); }); return {adv, dep}; }
const partyHeld = pid => sum(DB.txns.filter(t => t.partyId === pid && HOLD.includes(t.type)), holdVal);
function bookingConflicts(b, selfId){
  const a = b.from, z = b.to || b.from, out = [];
  if (!b.machineId || !a) return out;
  DB.bookings.forEach(x => { if (x.id === selfId || x.status !== 'Booked' || x.machineId !== b.machineId) return;
    const xa = x.from, xz = x.to || x.from; if (a <= xz && xa <= z) out.push(`Already booked for ${pName(x.partyId)} (${fd(xa)}${xz !== xa ? ' to ' + fd(xz) : ''})`); });
  DB.leases.forEach(l => { if (l.status === 'Closed' || l.machineId !== b.machineId) return;
    if (a <= (l.end || '9999-12-31') && (l.start || '0000') <= z) out.push(`On lease to ${pName(l.partyId)}`); });
  return out;
}
function partyBalances(){
  const b = {};
  DB.parties.forEach(p => b[p.id] = num(p.opening));
  DB.txns.forEach(t => { if (t.partyId) b[t.partyId] = (b[t.partyId]||0) + txPartyEffect(t); });
  return b;
}
function loanStats(l){
  const pays = DB.loanPays.filter(p => p.loanId === l.id).sort(byDateAsc);
  const pp = sum(pays, p => num(p.principal)), ip = sum(pays, p => num(p.interest));
  const rate = num(l.rate) / 100; let bal = num(l.principal), acc = 0, last = new Date(l.date || today());
  for (const p of pays) { const d = new Date(p.date); acc += bal * rate * Math.max(0, (d - last) / 864e5) / 365; bal -= num(p.principal); last = d; }
  acc += Math.max(0,bal) * rate * Math.max(0, (new Date(today()) - last) / 864e5) / 365;
  const out = l.status === 'Closed' ? 0 : num(l.principal) - pp;
  return { pays, pp, ip, out, due: l.status === 'Closed' ? 0 : Math.max(0, acc - ip) };
}
function summ(p){
  const r = {inc:0, exp:0, int:0, cin:0, cout:0, loanIn:0, loanOut:0, catI:{}, catE:{}, byM:{}};
  const M = id => r.byM[id||'_'] ||= {i:0, e:0};
  for (const t of DB.txns) {
    if (!inRange(t.date, p)) continue;
    const a = num(t.amount), pd = t.paid === '' || t.paid == null ? a : num(t.paid);
    if (t.type === 'income') { r.inc += a; r.cin += pd; r.catI[t.category||'Other Income'] = (r.catI[t.category||'Other Income']||0) + a; M(t.machineId).i += a; }
    else if (t.type === 'expense') { r.exp += a; r.cout += pd; r.catE[t.category||'Other Expense'] = (r.catE[t.category||'Other Expense']||0) + a; M(t.machineId).e += a; }
    else if (t.type === 'receipt' || t.type === 'advance') r.cin += a;
    else if (t.type === 'payment' || t.type === 'refund') r.cout += a;
    else if (t.type === 'forfeit') { r.inc += a; r.catI['Advance/Deposit Kept'] = (r.catI['Advance/Deposit Kept']||0) + a; M(t.machineId).i += a; }
  }
  for (const lp of DB.loanPays) if (inRange(lp.date, p)) { r.int += num(lp.interest); r.loanOut += num(lp.amount); }
  if (r.int) r.catE['Loan Interest'] = r.int;
  for (const l of DB.loans) if (inRange(l.date, p)) r.loanIn += num(l.principal);
  r.profit = r.inc - r.exp - r.int;
  r.cash = r.cin + r.loanIn - r.cout - r.loanOut;
  return r;
}
function machineStats(id){ let i = 0, e = 0; DB.txns.forEach(t => { if (t.machineId === id) { if (t.type==='income') i += num(t.amount); if (t.type==='expense') e += num(t.amount); } }); return {i, e}; }

/* ---------- UI state & render ---------- */
const S = { tab:'home', period: curMonth(), bf:{type:'', machine:'', party:'', q:''}, pq:'', dueOnly:false, bkStatus:'Booked', bkMachine:'' };
let rq = 0; function schedule(){ if (!rq) rq = requestAnimationFrame(() => { rq = 0; render(); }); }
const FAB_TABS = ['home','book','parties','loans','machines','leases','bookings'];
function render(){
  const v = $('#view'); if (!v) return;
  const ae = document.activeElement, aid = ae && v.contains(ae) && ae.id, pos = aid && ae.selectionStart;
  v.innerHTML = (VIEWS[S.tab] || VIEWS.home)();

/* ---------- bottom sheet ---------- */
function closeSheet(){ const s = $('#sheetBg'); if (s) s.remove(); }
function openSheet(title, body, {onSave, onDelete, saveText='Save'} = {}){
  closeSheet();
  const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.id = 'sheetBg';
  bg.innerHTML = `<div class="sheet"><div class="hd"><h3>${esc(title)}</h3><button class="x" type="button" onclick="A.close()">✕</button></div>
    <form id="sf" autocomplete="off" novalidate>${body}${onSave ? `<div class="btns" style="margin-top:12px"><button class="btn">${saveText}</button>${onDelete ? '<button type="button" class="btn r" id="sfDel" style="flex:0 0 auto">🗑 Delete</button>' : ''}</div>` : ''}</form></div>`;
  bg.addEventListener('click', e => { if (e.target === bg) closeSheet(); });
  document.body.appendChild(bg);
  const f = bg.querySelector('#sf');
  f.addEventListener('submit', e => { e.preventDefault(); if (!onSave) return; const d = Object.fromEntries(new FormData(f)); if (onSave(d, f) !== false) { closeSheet(); toast('Saved ✓'); } });
  if (onDelete) f.querySelector('#sfDel').onclick = () => { if (confirm('Delete this record permanently?')) { onDelete(); closeSheet(); toast('Deleted'); } };
  return f;
}
const partyOpts = (sel, blank='— None —') => `<option value="">${blank}</option>${[...DB.parties].sort((a,b) => a.name.localeCompare(b.name)).map(p => `<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)}${p.village?' ('+esc(p.village)+')':''}</option>`).join('')}<option value="__new">➕ Add new party…</option>`;
const machineOpts = (sel, blank='— General / None —') => `<option value="">${blank}</option>${DB.machines.map(m => `<option value="${m.id}" ${m.id===sel?'selected':''}>${esc(m.name)}</option>`).join('')}`;
function wireNewParty(sel, kind='Client / Farmer'){
  sel.addEventListener('change', () => {
    if (sel.value !== '__new') return;
    const name = (prompt('New party name:') || '').trim();
    if (!name) { sel.value = ''; return; }
    const phone = (prompt('Mobile number (optional):') || '').trim();
    const id = store.add('parties', {name, phone, village:'', kind, opening:0});
    const o = new Option(name, id, true, true); sel.insertBefore(o, sel.lastElementChild); sel.value = id; sel.dispatchEvent(new Event('input'));
  });
}

/* ---------- transaction form ---------- */
function txForm(id, preset = {}){
  const t = id ? {...DB.txns.find(x => x.id === id)} : {type:'income', date:today(), mode:'Cash', ...preset};
  if (!t.type) return;
  const pend = t.type === 'receipt' || t.type === 'payment', GROUP = pend ? ['receipt','payment'] : ['income','expense'];
  const f = openSheet((id ? 'Edit · ' : '') + (pend ? '⏳ Old Pending Payment' : '🆕 New Work / New Cost'), `
    <div style="font-size:12px;color:var(--mu);margin:-4px 0 8px">${pend ? 'Settle an old balance. This does <b>not</b> change profit.' : 'New work done for a client, or a new cost for the business.'}</div>
    ${t.bookingId && !id ? `<div class="card" style="background:#e0e7ff;font-size:13px">📅 Bill for booking. Advance held <b>${inr(heldOf('bookingId', t.bookingId))}</b> will be adjusted automatically against this bill.</div>` : ''}
    <div class="seg" id="tseg">${GROUP.map(k => `<button type="button" data-v="${k}">${ICON[k]} ${TYPE_LBL[k]}</button>`).join('')}</div>
    <input type="hidden" name="type" value="${t.type}"><input type="hidden" name="leaseId" value="${esc(t.leaseId||'')}"><input type="hidden" name="bookingId" value="${esc(t.bookingId||'')}">
    <div class="row"><label>Date<input type="date" name="date" value="${t.date}" required></label><label>Mode<select name="mode">${opts(MODES, t.mode)}</select></label></div>
    <label>Party / Client<select name="partyId">${partyOpts(t.partyId)}</select></label>
    <div id="partyDue" style="font-size:12px;margin:-4px 0 8px"></div>
    <div class="ie"><label>Machine<select name="machineId">${machineOpts(t.machineId)}</select></label>
      <label>Category<select name="category"></select></label>
      <div class="row" style="align-items:flex-end"><label>⏱ Time: Hours<input name="th" inputmode="numeric" placeholder="hr" value="${num(t.mins) ? Math.floor(num(t.mins)/60) : ''}"></label><label>Minutes<input name="tm" inputmode="numeric" placeholder="min" value="${num(t.mins) ? Math.round(num(t.mins)%60) : ''}"></label></div>
      <div class="row"><label>Qty (hr / acre / trip)<input name="qty" inputmode="decimal" value="${esc(t.qty||'')}"></label><label>Rate ₹<input name="rate" inputmode="decimal" value="${esc(t.rate||'')}"></label></div>
      <div id="timeInfo" style="font-size:12px;color:var(--mu);margin:-4px 0 8px">Per-hour work: fill Hours + Minutes, Qty fills itself</div></div>
    <label>Total Amount ₹<input name="amount" inputmode="decimal" required value="${esc(t.amount ?? '')}" style="font-size:18px;font-weight:700"></label>
    <div class="ie"><label><span id="paidLbl">Received now ₹</span><input name="paid" inputmode="decimal" value="${esc(t.paid ?? '')}" placeholder="Blank = full amount"></label>
      <div id="dueInfo" style="font-size:13px;margin:-4px 0 8px;font-weight:600" class="pen"></div></div>
    <label>Note<textarea name="note" rows="2" placeholder="Village, field, driver, bill no…">${esc(t.note||'')}</textarea></label>`,
  { onSave: d => {
      const ie = d.type === 'income' || d.type === 'expense', amount = num(d.amount);
      if (!d.date) return toast('Select date'), false;
      if (amount <= 0) return toast('Enter amount'), false;
      const paid = ie ? (d.paid.trim() === '' ? amount : num(d.paid)) : amount;
      if (paid > amount) return toast('Paid cannot be more than total'), false;
      if (d.partyId === '__new') d.partyId = '';
      if (!ie && !d.partyId) return toast('Select party'), false;
      if (ie && paid < amount && !d.partyId) return toast('Select party to track pending amount'), false;
      const rec = { type:d.type, date:d.date, mode:d.mode, partyId:d.partyId, leaseId:d.leaseId||'', bookingId:d.bookingId||'', note:d.note.trim(), amount, paid,
        machineId: ie ? d.machineId : '', category: ie ? d.category : TYPE_LBL[d.type], qty: ie ? d.qty : '', rate: ie ? d.rate : '',
        mins: ie && (num(d.th) || num(d.tm)) ? Math.round(num(d.th) * 60 + num(d.tm)) : '', unit: ie && (num(d.th) || num(d.tm)) ? (t.unit || 'hr') : '' };
      if (id) store.set('txns', id, rec);
      else { const nid = store.add('txns', rec); if (d.bookingId) finishBooking(d.bookingId, {doneTxnId: nid}, d.date); }
    }, onDelete: id ? () => store.del('txns', id) : null });
  const E = f.elements;
  const upd = () => {
    if (E.qty.value && E.rate.value && document.activeElement !== E.amount) E.amount.value = +(num(E.qty.value) * num(E.rate.value)).toFixed(2);
    const ty = E.type.value, ie = ty === 'income' || ty === 'expense', a = num(E.amount.value);
    const due = ie && E.paid.value.trim() !== '' ? a - num(E.paid.value) : 0;
    $('#dueInfo').textContent = due > 0 ? `⏳ Pending: ${inr(due)} ${ty==='income'?'(party will owe you)':'(you will owe party)'}` : '';
    const pid = E.partyId.value, b = pid && pid !== '__new' ? (partyBalances()[pid]||0) : 0;
    $('#partyDue').innerHTML = pid && pid !== '__new' ? (b > 0.5 ? `<span class="pen">Current due from party: <b>${inr(b)}</b></span>` : b < -0.5 ? `<span class="exp">You owe this party: <b>${inr(-b)}</b></span>` : '<span class="inc">Party account settled</span>') : '';
  };
  const setType = ty => {
    E.type.value = ty;
    f.querySelectorAll('#tseg button').forEach(b => b.classList.toggle('on', b.dataset.v === ty));
    const ie = ty === 'income' || ty === 'expense';
    f.querySelectorAll('.ie').forEach(x => x.classList.toggle('hidden', !ie));
    if (ie) { const cats = CATS[ty]; E.category.innerHTML = opts(cats.includes(t.category) ? cats : [...cats], t.category); }
    $('#paidLbl').textContent = ty === 'income' ? 'Received now ₹' : 'Paid now ₹';
    upd();
  };
  f.querySelectorAll('#tseg button').forEach(b => b.onclick = () => setType(b.dataset.v));
  ['qty','rate','amount','paid','partyId'].forEach(n => E[n].addEventListener('input', upd));
  const tUpd = () => { const mins = num(E.th.value) * 60 + num(E.tm.value); if (!mins) return;
    const pm = t.unit === 'min'; E.qty.value = pm ? Math.round(mins) : +(mins / 60).toFixed(2);
    $('#timeInfo').textContent = `${hm(mins)} = ${E.qty.value} ${pm ? 'min' : 'hours'}`; upd(); };
  E.th.addEventListener('input', tUpd); E.tm.addEventListener('input', tUpd);
  E.qty.addEventListener('input', () => { if (E.th.value || E.tm.value) { E.th.value = ''; E.tm.value = ''; $('#timeInfo').textContent = 'Time cleared (qty typed manually)'; } });
  if (num(t.mins)) $('#timeInfo').textContent = `${hm(num(t.mins))} = ${t.qty} ${t.unit === 'min' ? 'min' : 'hours'}`;
  E.partyId.addEventListener('change', () => {   // pending mode: fill full due automatically
    upd(); if (!pend || id || E.amount.value) return;
    const b = partyBalances()[E.partyId.value] || 0, ty = E.type.value;
    if (ty === 'receipt' && b > 0.5) E.amount.value = Math.round(b);
    if (ty === 'payment' && b < -0.5) E.amount.value = Math.round(-b);
  });
  wireNewParty(E.partyId);
  setType(t.type);
}

function holdNew(key, refId){

/* refund / adjust / keep held money — also used to cancel a booking */
function settleForm(key, refId, cancel = false){
  const o = key === 'bookingId' ? DB.bookings.find(x => x.id === refId) : DB.leases.find(x => x.id === refId);
  const held = heldOf(key, refId), what = key === 'leaseId' ? 'deposit' : 'advance', due = partyBalances()[o.partyId] || 0;
  const f = openSheet(cancel ? 'Cancel Booking' : `Settle ${what}`, `
    <div class="card" style="background:#e0e7ff">${esc(pName(o.partyId))} · ${esc(mName(o.machineId))}<div class="big blu">${inr(held)}</div><div style="font-size:13px">${what} held${due > 0.5 ? ` · party also owes you ${inr(due)}` : ''}</div></div>
    <div class="row"><label>Date<input type="date" name="date" value="${today()}"></label><label>Refund mode<select name="mode">${opts(MODES,'Cash')}</select></label></div>
    <label>↩️ Refund to party ₹<input name="refund" inputmode="decimal" value="${cancel ? Math.round(held) : ''}"></label>
    <label>🔁 Adjust against party's dues ₹<input name="adjust" inputmode="decimal"></label>
    <label>📌 Keep (forfeit, counted as income) ₹<input name="forfeit" inputmode="decimal" ${cancel ? 'readonly' : ''}></label>
    <div id="stInfo" style="font-size:13px;font-weight:600;margin-bottom:8px"></div>
    <label>Note / reason<input name="note"></label>`,
  { saveText: cancel ? 'Cancel Booking' : 'Save',
    onSave: d => {
      let r = num(d.refund), a = num(d.adjust), k = num(d.forfeit);
      if (cancel) k = Math.max(0, held - r - a);
      if (r + a + k > held + 0.5) return toast(`Total is more than ${what} held`), false;
      if (!cancel && r + a + k <= 0) return toast('Enter an amount'), false;
      const base = {[key]:refId, partyId:o.partyId, machineId:o.machineId, date:d.date, note:d.note.trim()};
      if (r > 0) store.add('txns', {...base, type:'refund', amount:r, mode:d.mode});
      if (a > 0) store.add('txns', {...base, type:'adjust', amount:a, mode:''});
      if (k > 0) store.add('txns', {...base, type:'forfeit', amount:k, mode:''});
      if (cancel) store.set('bookings', refId, {status:'Cancelled', cancelDate:d.date, cancelNote:d.note.trim()});
    } });
  const E = f.elements, u = () => { const r = num(E.refund.value), a = num(E.adjust.value);
    if (cancel) E.forfeit.value = Math.max(0, Math.round(held - r - a)) || '';
    const left = held - r - a - num(E.forfeit.value);
    $('#stInfo').innerHTML = left < -0.5 ? `<span class="exp">More than held by ${inr(-left)}</span>` : `<span class="blu">Remaining held after this: ${inr(left)}</span>`; };
  ['refund','adjust','forfeit'].forEach(n => E[n].addEventListener('input', u)); u();
}

function leaseStatement(lid){
  const l = DB.leases.find(x => x.id === lid); if (!l) return;
  const p = party(l.partyId) || {}, from = l.start || '0000';
  const L = DB.txns.filter(t => (t.leaseId === lid && ['income','expense','adjust'].includes(t.type)) || (t.partyId === l.partyId && t.type === 'receipt' && t.date >= from) || (t.partyId === l.partyId && t.type === 'payment' && t.date >= from)).sort(byDateAsc);
  let rent = 0, cost = 0, recd = 0, adj = 0;
  const rows = L.map(t => { const a = num(t.amount);
    let lbl, v, cls;
    if (t.type === 'income') { rent += a; recd += num(t.paid); lbl = 'Rent'; v = '+' + inr(a); cls = 'inc'; }
    else if (t.type === 'expense') { cost += a - num(t.paid); lbl = (t.category === 'Diesel' ? '⛽ Fuel' : t.category) + ' by lessee'; v = '−' + inr(a - num(t.paid)); cls = 'exp'; }
    else if (t.type === 'adjust') { adj += a; lbl = 'Deposit adjusted'; v = '−' + inr(a); cls = 'exp'; }
    else if (t.type === 'receipt') { recd += a; lbl = '💰 Received'; v = '−' + inr(a); cls = 'blu'; }
    else { recd -= a; lbl = 'Paid to lessee'; v = '+' + inr(a); cls = 'pen'; }
    return `<tr onclick="A.editTx('${t.id}')"><td>${fd(t.date)}</td><td>${esc(lbl)}${qtyText(t) ? `<br><small>${esc(qtyText(t))}</small>` : ''}</td><td class="n ${cls}">${v}</td></tr>`; }).join('');
  const bal = rent - cost - adj - recd;
  const msg = encodeURIComponent(`NAYAK Agro – Lease Statement\n${mName(l.machineId)} → ${p.name||''}\nFrom ${fd(l.start)}\n\nRent: ₹${Math.round(rent).toLocaleString('en-IN')}\nLess fuel/cost by you: ₹${Math.round(cost).toLocaleString('en-IN')}${adj ? `\nLess deposit adjusted: ₹${Math.round(adj).toLocaleString('en-IN')}` : ''}\nLess received: ₹${Math.round(recd).toLocaleString('en-IN')}\n\n${bal >= 0 ? 'Balance to pay' : 'We owe you'}: ₹${Math.round(Math.abs(bal)).toLocaleString('en-IN')}\nDhanyavad 🙏`);
  const ph = (p.phone||'').replace(/\D/g,'').slice(-10);
  openSheet('📋 Lease Statement', `
    <div style="font-size:13px;color:var(--mu);margin-bottom:8px">${esc(mName(l.machineId))} → <b>${esc(p.name||'')}</b> · from ${fd(l.start)}</div>
    <div class="card"><table>
      <tr><td>Total rent</td><td class="n inc">${inr(rent)}</td></tr>
      <tr><td>Less: fuel / cost paid by lessee</td><td class="n exp">− ${inr(cost)}</td></tr>
      ${adj ? `<tr><td>Less: deposit adjusted</td><td class="n exp">− ${inr(adj)}</td></tr>` : ''}
      <tr><td>Less: received from lessee</td><td class="n blu">− ${inr(recd)}</td></tr>
      <tr><th>${bal >= 0 ? 'Lessee has to pay' : 'You owe lessee'}</th><th class="n big ${bal >= 0 ? 'pen' : 'exp'}" style="font-size:20px">${inr(Math.abs(bal))}</th></tr></table></div>
    <div class="btns" style="margin-bottom:10px">
      ${bal > 0.5 ? `<button type="button" class="btn s b" onclick="A.newTx('receipt',{partyId:'${l.partyId}',amount:${Math.round(bal)}})">💰 Receive ${inr(bal)}</button>` : ''}
      ${ph ? `<a class="btn s" style="background:#25d366;text-decoration:none;text-align:center" href="https://wa.me/91${ph}?text=${msg}" target="_blank">Send on WhatsApp</a>` : ''}</div>
    <table><tr><th>Date</th><th>Detail</th><th class="n">Amount</th></tr>${rows || '<tr><td colspan="3" class="empty">No entries yet</td></tr>'}</table>`);
}

    <div class="row"><label>EMI ₹<input name="emi" inputmode="decimal" value="${esc(l.emi||'')}"></label><label>Status<select name="status">${opts(['Open','Closed'], l.status)}</select></label></div>
    <label>For machine<select name="machineId">${machineOpts(l.machineId)}</select></label>
    <label>Note<textarea name="note" rows="2">${esc(l.note||'')}</textarea></label>`,
  { onSave: d => {
      if (!d.lender.trim() || num(d.principal) <= 0) return toast('Enter lender and amount'), false;
      const rec = {kind:d.kind, lender:d.lender.trim(), ref:d.ref.trim(), principal:num(d.principal), date:d.date, rate:num(d.rate), tenure:d.tenure, emi:num(d.emi), status:d.status, machineId:d.machineId, note:d.note.trim()};
      id ? store.set('loans', id, rec) : store.add('loans', rec);
    },
    onDelete: id ? () => { DB.loanPays.filter(p => p.loanId === id).forEach(p => store.del('loanPays', p.id)); store.del('loans', id); } : null });
}
function loanView(id){
  const l = DB.loans.find(x => x.id === id); if (!l) return;
  const s = loanStats(l);
  openSheet(l.lender, `
    <div class="card" style="background:#fee2e2"><div style="font-size:12px;color:var(--mu)">${esc(l.kind)} · taken ${fd(l.date)} · ${num(l.rate)}% p.a.${l.machineId?' · '+esc(mName(l.machineId)):''}</div>
      <div class="big exp">${inr(s.out)}</div><div style="font-size:13px">Principal outstanding of ${inr(l.principal)}</div></div>
    <div class="grid" style="margin-bottom:10px">${stat('Principal Repaid', inr(s.pp), 'inc')}${stat('Interest Paid', inr(s.ip))}${stat('Interest Due (approx)', inr(s.due), 'pen')}${stat('EMI', l.emi?inr(l.emi):'—')}</div>
    <div class="btns" style="margin-bottom:10px"><button type="button" class="btn s" onclick="A.loanPay('${id}')">+ Add Repayment</button><button type="button" class="btn s o" onclick="A.editLoan('${id}')">✏️ Edit Loan</button></div>
    ${l.note ? `<p style="font-size:13px;color:var(--mu)">${esc(l.note)}</p>` : ''}
    <table><tr><th>Date</th><th class="n">Paid</th><th class="n">Principal</th><th class="n">Interest</th></tr>
      ${[...s.pays].reverse().map(p => `<tr onclick="A.loanPay('${id}','${p.id}')"><td>${fd(p.date)}<br><small>${esc(p.mode||'')} ${esc(p.note||'')}</small></td><td class="n">${inr(p.amount)}</td><td class="n">${inr(p.principal)}</td><td class="n">${inr(p.interest)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">No repayments yet</td></tr>'}</table>
    <p style="font-size:11px;color:var(--mu)">Interest due is approximate simple interest on remaining principal. For bank loans, check your bank statement.</p>`);
}
function loanPayForm(loanId, pid){
  const l = DB.loans.find(x => x.id === loanId), p = pid ? DB.loanPays.find(x => x.id === pid) : {date:today(), mode:'Cash', amount:l.emi||''};
  const f = openSheet(`${pid?'Edit':'Add'} Repayment · ${l.lender}`, `
    <div class="row"><label>Date<input type="date" name="date" value="${esc(p.date)}"></label><label>Mode<select name="mode">${opts(MODES, p.mode)}</select></label></div>
    <label>Total paid ₹ *<input name="amount" inputmode="decimal" required value="${esc(p.amount)}" style="font-size:18px;font-weight:700"></label>
    <label>Interest part ₹<input name="interest" inputmode="decimal" value="${esc(p.interest ?? '')}"></label>
    <div id="prInfo" style="font-size:13px;margin:-4px 0 8px;font-weight:600" class="inc"></div>
    <label>Note<input name="note" value="${esc(p.note||'')}"></label>`,
  { onSave: d => {
      const amount = num(d.amount), interest = num(d.interest);
      if (amount <= 0) return toast('Enter amount'), false;
      if (interest > amount) return toast('Interest cannot exceed total'), false;
      const rec = {loanId, date:d.date, mode:d.mode, amount, interest, principal: amount - interest, note:d.note.trim()};
      pid ? store.set('loanPays', pid, rec) : store.add('loanPays', rec);
      setTimeout(() => loanView(loanId), 150);
    }, onDelete: pid ? () => { store.del('loanPays', pid); setTimeout(() => loanView(loanId), 150); } : null });
  const E = f.elements, u = () => $('#prInfo').textContent = `Principal reduced by: ${inr(num(E.amount.value) - num(E.interest.value))}`;
  E.amount.oninput = E.interest.oninput = u; u();
}

/* ---------- export / backup ---------- */
function exportCSV(){
  const L = DB.txns.filter(t => inRange(t.date, S.period)).sort(byDateAsc);
  const H = ['Date','Type','Category','Machine','Party','Time (h:m)','Qty','Rate','Amount','Paid/Received','Pending','Mode','Note'];
  const q = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const rows = L.map(t => { const ie = t.type==='income'||t.type==='expense'; return [fd(t.date), TYPE_LBL[t.type], t.category, mName(t.machineId), pName(t.partyId), num(t.mins) ? hm(num(t.mins)) : '', t.qty, t.rate, num(t.amount), num(t.paid), ie ? num(t.amount)-num(t.paid) : 0, t.mode, t.note].map(q).join(','); });
  download(`NAYAK-entries-${S.period}.csv`, '﻿' + [H.join(','), ...rows].join('\n'), 'text/csv');
}
function backup(){ download(`NAYAK-backup-${today()}.json`, JSON.stringify({app:'NAYAK Agro Ledger', at:new Date().toISOString(), data:DB}, null, 1), 'application/json'); }
function restore(inp){
  const file = inp.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const j = JSON.parse(rd.result), d = j.data || j; let n = 0;
      if (!confirm('Restore records from backup? Existing records with the same ID will be overwritten.')) return;
      COLS.forEach(c => (d[c] || []).forEach(r => { if (r.id) { store.set(c, r.id, r); n++; } }));
      toast(`Restored ${n} records ✓`);
    } catch (e) { alert('Invalid backup file'); }
    inp.value = '';
  };
  rd.readAsText(file);
}

/* ---------- auth ---------- */
const LCRED = 'nayak_cred', LSESS = 'nayak_session';
const localCred = () => { try { return JSON.parse(localStorage.getItem(LCRED)) || {u:'admin', p:'nayak@123'}; } catch(e) { return {u:'admin', p:'nayak@123'}; } };
function showLogin(){ closeSheet(); $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); $('#loginHint').textContent = CLOUD ? 'Login ID: Admin · stays logged in on this phone' : 'Local demo login: admin / nayak@123'; }
function showApp(){ $('#login').classList.add('hidden'); $('#app').classList.remove('hidden'); store.start(); render(); }
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const u = e.target.u.value.trim().toLowerCase(), p = e.target.p.value; $('#loginErr').textContent = '';
  if (CLOUD) {
    try { localStorage.removeItem(LOGIN_AT); await AU.signInWithEmailAndPassword(auth, u.includes('@') ? u : `${u}@${LOGIN_DOMAIN}`, p); }
    catch (x) { $('#loginErr').textContent = 'Wrong username or password'; }
  } else {
    const c = localCred();
    if (u === c.u && p === c.p) { localStorage.setItem(LSESS, u); showApp(); } else $('#loginErr').textContent = 'Wrong username or password';
  }
});
if (CLOUD) AU.onAuthStateChanged(auth, u => { if (u) showApp(); else { store.stop(); showLogin(); } });
else localStorage.getItem(LSESS) ? showApp() : showLogin();

/* ---------- online status & PWA ---------- */
const net = () => { const n = $('#net'); if (n) n.textContent = !CLOUD ? '📱 Local' : navigator.onLine ? '● Online' : '○ Offline (will sync)'; };
addEventListener('online', net); addEventListener('offline', net); net();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ---------- public actions ---------- */
window.A = {
  go(t){ S.tab = t; closeSheet(); scrollTo(0,0); render(); },
  setPer(p){ S.period = p; render(); },
  bf(k, v){ S.bf[k] = v; render(); },
  bookParty(id){ S.bf = {type:'', machine:'', party:id, q:''}; S.period = 'all'; A.go('book'); },
  bookMachine(id){ S.bf = {type:'', machine:id, party:'', q:''}; A.go('book'); },
  pq(v){ S.pq = v; render(); },
  dueOnly(force){ S.dueOnly = force === true ? true : !S.dueOnly; render(); },
  fab(){ ({home:entryChooser, book:entryChooser, parties:()=>partyForm(), loans:()=>loanForm(), machines:()=>machineForm(), leases:()=>leaseForm(), bookings:()=>bookingForm()}[S.tab] || (()=>{}))(); },
  newTx(type, preset={}){ txForm(null, {type, ...preset}); },
  editTx(id){ const t = DB.txns.find(x => x.id === id); if (t) HOLD.includes(t.type) ? holdTxForm(id) : txForm(id); },
  newBooking: (preset={}) => bookingForm(null, preset),
  booking: id => bookingView(id),
  editBooking: id => bookingForm(id),
  convert: id => convertBooking(id),
  holdNew: (key, id) => holdNew(key, id),
  settle: (key, id, cancel) => settleForm(key, id, !!cancel),
  bk(k, v){ S[k] = v; render(); },
  party: id => partyView(id),
  editParty: id => partyForm(id),
  machine: id => machineForm(id),
  lease: id => leaseForm(id),
  leaseFuel: id => leaseFuelForm(id),
  leaseStmt: id => leaseStatement(id),
  leaseBill(id){ const l = DB.leases.find(x => x.id === id); if (TIME_BASIS.includes(l.basis)) return leaseTimeBill(id); txForm(null, {type:'income', category:'Lease Rent', machineId:l.machineId, partyId:l.partyId, leaseId:id, amount:l.rent||'', paid:'0', note:`Lease rent (${l.basis})`}); },
  loan: id => loanView(id),
  editLoan: id => loanForm(id),
  loanPay: (lid, pid) => loanPayForm(lid, pid),
  close: closeSheet,
  csv: exportCSV, backup, restore,
  async changePw(e){
    e.preventDefault(); const np = e.target.np.value;
    if (np.length < 6) return toast('Minimum 6 characters');
    if (CLOUD) { try { await AU.updatePassword(auth.currentUser, np); toast('Password changed ✓'); } catch (x) { alert('Please logout and login again, then change password.\n' + x.message); } }
    else { localStorage.setItem(LCRED, JSON.stringify({u: localCred().u, p: np})); toast('Password changed ✓'); }
    e.target.reset();
  },
  logout(){ if (!confirm('Logout from this phone?')) return; localStorage.removeItem(LOGIN_AT); if (CLOUD) AU.signOut(auth); else { localStorage.removeItem(LSESS); showLogin(); } },
  forceLogout(){
    if (!confirm('Logout ALL phones using this app?')) return;
    F.setDoc(F.doc(db,'biz',BIZ,'config','app'), {forceVer: F.increment(1), at: Date.now(), by: auth.currentUser?.email || ''}, {merge:true})
      .then(() => toast('All devices will be logged out')).catch(syncErr);
  }
};
</script>
